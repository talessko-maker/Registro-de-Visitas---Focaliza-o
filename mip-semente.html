<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuais Internos de Processos — Terra Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9F4; --surface:#FFFFFF; --soft:#EDF2E7; --line:#D6DFCF;
  --ink:#1E2A21; --muted:#5B6A60; --green:#507938; --green-ink:#3F612C;
  --slate:#506366; --warn-bg:#FFF6E0; --warn-ink:#7A5A00; --check:#507938;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131915; --surface:#1B231D; --soft:#222C24; --line:#2F3B32;
    --ink:#E4EAE1; --muted:#9DAA9F; --green:#8DB86E; --green-ink:#A9CC8F;
    --slate:#9AB0B3; --warn-bg:#2E2814; --warn-ink:#E9C766; --check:#7FAE5F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1B231D; --soft:#222C24; --line:#2F3B32;
  --ink:#E4EAE1; --muted:#9DAA9F; --green:#8DB86E; --green-ink:#A9CC8F;
  --slate:#9AB0B3; --warn-bg:#2E2814; --warn-ink:#E9C766; --check:#7FAE5F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gotham","Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--green-ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}

/* logo: troca de variante por tema */
.logo{display:block;height:38px;width:auto}
.logo svg{height:38px;width:auto;display:block}
.logo-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-c{display:none}:root:not([data-theme="light"]) .logo-w{display:block}}
:root[data-theme="dark"] .logo-c{display:none}
:root[data-theme="dark"] .logo-w{display:block}

/* layout */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));
  overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:28px 22px;display:flex;flex-direction:column;gap:28px}
.side-meta{font-size:13px;color:var(--muted);line-height:1.5}
.side-meta strong{color:var(--ink);font-weight:700;display:block;font-size:14px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;line-height:1.35}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft);color:var(--green-ink);font-weight:700}
nav .n{font-weight:800;color:var(--green);min-width:16px;font-variant-numeric:tabular-nums}
.side-tools{margin-top:auto;display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;text-align:left}
.btn:hover{border-color:var(--green)}

main{padding:0 clamp(18px,5vw,64px) 96px}
.wrap{max-width:780px}

/* topo do documento */
.doc-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0 22px;border-bottom:1px solid var(--line)}
.doc-top .mobile-logo{display:none;flex-shrink:0}
.doc-kind{font-size:13px;color:var(--muted);font-weight:600}
.hero{padding:56px 0 40px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.02em;font-weight:800;margin:0 0 18px;color:var(--ink)}
.hero h1 span{display:block;color:var(--green)}
.hero p{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.ficha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:36px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ficha div{padding:14px 16px;border-right:1px solid var(--line)}
.ficha div:last-child{border-right:0}
.ficha dt{font-size:12px;color:var(--muted);font-weight:600}
.ficha dd{margin:2px 0 0;font-weight:700;font-size:15px}
.ficha dd.empty{color:var(--muted);font-weight:500}

section.block{padding:56px 0 8px;border-top:1px solid var(--line)}
.sec-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.sec-num{font-size:56px;line-height:.85;font-weight:800;color:var(--green);opacity:.9;font-variant-numeric:tabular-nums;min-width:44px}
.sec-head h2{font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em}
.objetivo{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:64ch}
.objetivo b{color:var(--ink)}

/* análise do cargo */
.resumo{font-size:19px;line-height:1.55;margin:0 0 28px;max-width:66ch}
.hier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:34px}
.hier div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.hier h4{margin:0 0 6px;font-size:13px;color:var(--green-ink);font-weight:700}
.hier p{margin:0;font-size:14.5px;line-height:1.5}
h3{font-size:19px;margin:34px 0 12px;font-weight:700}
.attr{list-style:none;margin:0;padding:0;counter-reset:a}
.attr li{position:relative;padding:12px 0 12px 44px;border-bottom:1px solid var(--line);counter-increment:a}
.attr li::before{content:counter(a);position:absolute;left:0;top:11px;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--green-ink);font-weight:800;font-size:13px;display:grid;place-items:center}
.comp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.comp div{border-left:3px solid var(--green);padding:4px 0 4px 14px}
.comp h4{margin:0 0 4px;font-size:15px}
.comp p{margin:0;font-size:14.5px;color:var(--muted)}
.dados{margin:0;display:grid;grid-template-columns:200px minmax(0,1fr);border-top:1px solid var(--line)}
.dados dt,.dados dd{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.dados dt{font-weight:700;font-size:14.5px;padding-right:14px}
.dados dd{font-size:15px}
.dados dd small{display:block;color:var(--muted)}

/* checklists */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.phase>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px}
.phase>summary::-webkit-details-marker{display:none}
.phase>summary .pt{font-weight:700;font-size:16px;flex:1}
.phase>summary .pc{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;background:var(--soft);border-radius:4px;width:70px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}
.phase[open] .chev{transform:rotate(225deg);margin-top:4px}
.phase.done>summary .pt{color:var(--green-ink)}
.items{list-style:none;margin:0;padding:0 18px 12px;border-top:1px solid var(--line)}
.items>li{border-bottom:1px solid var(--line)}
.items>li:last-child{border-bottom:0}
.items label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:11px 0;cursor:pointer;align-items:start}
.items input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;margin:2px 0 0;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.items input:checked{background:var(--check);border-color:var(--check)}
.items input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.items input:checked+span .it{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.it{font-size:15px}
.sub{margin:4px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.sub li{padding-left:14px;position:relative;margin:2px 0}
.sub li::before{content:"";position:absolute;left:2px;top:.7em;width:5px;height:1.5px;background:var(--muted)}
.key{font-weight:700;color:var(--ink)}
.flag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--warn-bg);color:var(--warn-ink);margin-left:6px;vertical-align:1px}

/* calculadora */
.calc{background:var(--green);color:#fff;border-radius:14px;padding:22px 22px 18px;margin:20px 0 6px}
:root[data-theme="dark"] .calc{background:#2C4421}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .calc{background:#2C4421}}
.calc h4{margin:0;font-size:17px;font-weight:700}
.calc p.cs{margin:2px 0 16px;font-size:14px;opacity:.85}
.calc-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.calc-in label{font-weight:600;font-size:14px}
.calc input[type=range]{flex:1;min-width:160px;accent-color:#fff}
.calc output{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.22);border-radius:10px;overflow:hidden;margin-top:18px}
.calc-grid div{background:rgba(0,0,0,.14);padding:12px 12px 10px}
.calc-grid b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.calc-grid span{font-size:12.5px;opacity:.9;line-height:1.4;display:block}.calc-grid span span{display:inline}
.calc .note{font-size:12.5px;margin:12px 0 0;opacity:.85}
.calc .over{background:#fff;color:#7A5A00;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:12px;display:none}

/* tabelas e figura */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:16px 0}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
th:last-child,td:last-child{border-right:0}
th{background:var(--soft);font-weight:700;font-size:13px}
td{height:40px}
figure{margin:20px 0 0}
figure img{border-radius:10px;border:1px solid var(--line);display:block;width:100%;max-width:420px}
figcaption{font-size:13px;color:var(--muted);margin-top:8px}

.callout{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:14px 16px;font-size:14.5px;margin:16px 0}
.callout b{color:inherit}
.pendente{border:2px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted);text-align:center}
.pendente b{color:var(--ink);display:block;margin-bottom:4px}

.foot{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:900px){
  .shell{display:block}
  aside{position:sticky;top:0;height:auto;padding:10px 0;border-right:0;border-bottom:1px solid var(--line);z-index:5;gap:0;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  aside .logo,.side-meta,.side-tools{display:none}
  nav ol{flex-direction:row;overflow-x:auto;padding:0 14px;gap:4px;scrollbar-width:none}
  nav a{white-space:nowrap;padding:7px 11px;font-size:13px}
  .doc-top .mobile-logo{display:block}
  .ficha{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ficha div:nth-child(2){border-right:0}
  .ficha div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .mobile-tools{display:flex !important}
}
.mobile-tools{display:none;gap:8px}
@media (max-width:480px){.doc-kind{display:none}}
@media (max-width:620px){
  .hier,.comp{grid-template-columns:1fr}
  .dados{grid-template-columns:1fr}
  .dados dt{border-bottom:0;padding-bottom:0}
  .calc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec-num{font-size:40px;min-width:30px}
  .resumo{font-size:17px}
}
@media print{
  aside,.side-tools,.mobile-tools,.calc input{display:none!important}
  .shell{display:block}
  .phase{break-inside:avoid}
  .phase .items{display:block!important}
  body{background:#fff}
}
/* ---- multi-manual ---- */
.mans{display:flex;flex-direction:column;gap:4px}
.mans-h{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 10px}
.man{display:block;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:8px;border:1px solid transparent}
.man b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.man small{font-size:12px;color:var(--muted)}
.man:hover{background:var(--soft)}
.man.on{border-color:var(--line);background:var(--soft)}
.man.on b{color:var(--green-ink)}
nav.fn{border-top:1px solid var(--line);padding-top:16px}
nav.fn:empty{display:none}
.home-link{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:0 10px}
.home-link:hover{color:var(--green-ink)}
.mob-cargo{display:none}

/* home */
.home-hero{padding:64px 0 32px}
.home-hero h1{font-size:clamp(36px,6vw,62px);line-height:1.02;letter-spacing:-.02em;font-weight:800;margin:0 0 16px}
.home-hero h1 span{display:block;color:var(--green)}
.home-hero p{font-size:18px;color:var(--muted);max-width:58ch;margin:0}
.mcards{display:grid;gap:14px;margin-top:8px}
.mcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;transition:border-color .15s}
.mcard:hover{border-color:var(--green)}
.mcard .dep{font-size:13px;color:var(--muted);font-weight:600;grid-column:1}
.mcard h2{margin:0;font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.01em;line-height:1.15;grid-column:1}
.mcard p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:60ch;grid-column:1}
.mcard .cnt{grid-column:2;grid-row:1/4;text-align:right;align-self:center}
.mcard .cnt b{display:block;font-size:44px;line-height:1;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.mcard .cnt span{font-size:12.5px;color:var(--muted);font-weight:600}
.nota-dup{margin-top:28px;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:14px}

/* blocos genéricos */
.blk{margin:22px 0}
.blk>h3,.blk-t{font-size:17px;font-weight:700;margin:0 0 10px}
.glist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.glist>li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.glist>li::before{content:"";position:absolute;left:4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.glist.no>li::before{background:none;border-radius:0;width:10px;height:10px;top:16px;left:2px;
  background:linear-gradient(45deg,transparent 43%,#B3412E 43%,#B3412E 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,#B3412E 43%,#B3412E 57%,transparent 57%)}
.ptxt{font-size:16px;max-width:68ch;margin:18px 0}
.callout.info{background:var(--soft);color:var(--ink)}
.callout p{margin:4px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.cards>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cards h4{margin:0 0 4px;font-size:15px;color:var(--green-ink)}
.cards p{margin:0;font-size:14.5px;line-height:1.5}
.pairs{margin:0;display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);border-top:1px solid var(--line)}
.pairs dt,.pairs dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
.pairs dt{font-weight:700;font-size:14.5px;padding-right:16px}
.pairs dd{font-size:15px}
.quote{margin:0;padding:18px 22px;border-left:4px solid var(--green);background:var(--surface);border-radius:0 10px 10px 0}
.quote small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.quote p{margin:0;font-size:17px;line-height:1.55}
.quote.big p{font-size:clamp(22px,3.4vw,30px);font-weight:800;color:var(--green);line-height:1.2;letter-spacing:-.01em}
.ua{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ua div{border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5}
.ua .u{background:color-mix(in srgb,var(--green) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.ua .a{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.ua b{display:block;font-size:12.5px;margin-bottom:4px;color:var(--green-ink)}
.ua .a b{color:#B3412E}
:root[data-theme="dark"] .ua .a b{color:#E58C7A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ua .a b{color:#E58C7A}}
.ua-p{margin:0;color:var(--muted);font-size:15px}
.eixos{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.eixo{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:baseline;font-size:14.5px}
.eixo:last-child{border-bottom:0}
.eixo b{font-size:16px;color:var(--green-ink)}
.eixo .ev{color:var(--muted)}
.eixo .ev::before{content:"Evitar: ";font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:5px 11px;border-radius:20px;font-size:14px;font-weight:600}
.chips.ok span{background:color-mix(in srgb,var(--green) 14%,var(--surface));color:var(--green-ink)}
.chips.no span{background:var(--surface);border:1px solid var(--line);color:var(--muted);text-decoration:line-through;text-decoration-color:#B3412E}
.words-x{margin:10px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
.emo{display:flex;gap:10px;flex-wrap:wrap;font-size:30px}
.emo span{width:52px;height:52px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.emo-n{font-size:13px;color:var(--muted);margin-top:8px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:10px 0;position:relative}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;position:relative;z-index:1}
:root[data-theme="dark"] .steps li::before{color:#132015}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps li::before{color:#132015}}
.steps li:not(:last-child)::after{content:"";position:absolute;left:15px;top:42px;bottom:-2px;width:2px;background:var(--line)}
.steps b{display:block;font-size:15.5px}
.steps span{font-size:14.5px;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.sw div{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sw i{display:block;height:84px;border-bottom:1px solid var(--line)}
.sw p{margin:0;padding:10px 12px 12px;font-size:13px;line-height:1.45;color:var(--muted)}
.sw p b{display:block;color:var(--ink);font-size:14px}
.sw p code{font-family:inherit;font-weight:700;color:var(--ink);font-size:13.5px}
.fmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.fmt-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.fmt-h .ratio{flex-shrink:0;border:2px solid var(--green);border-radius:4px}
.fmt-h .r916{width:18px;height:32px}.fmt-h .r11{width:26px;height:26px}
.fmt-h small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fmt-h b{font-size:17px}
.fmt .pairs{border-top:0;padding:0 18px}
.fmt .pairs dt:last-of-type,.fmt .pairs dd:last-of-type{border-bottom:0}
.fmt-ex{margin:0;padding:12px 18px;background:var(--soft);font-size:14.5px}
.fmt-ex::before{content:"Exemplo real: ";font-weight:700}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tipos div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.tipos b{display:block;font-size:14.5px;line-height:1.3}
.tipos span{font-size:13.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin:6px 0 4px}
.p-tecnica{background:#E3EEDB;color:#36561F}.p-confianca{background:#DCE6E8;color:#33484C}
.p-mercado{background:#F3EBD6;color:#6B5413}.p-cultura{background:#EFE0DA;color:#7A3A26}
.matriz{width:100%;min-width:0}
.matriz td,.matriz th{height:auto}
.tipo{border-top:1px solid var(--line);padding:18px 0}
.tipo-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tipo-h .tn{font-size:28px;font-weight:800;color:var(--green);width:30px;font-variant-numeric:tabular-nums}
.tipo-h b{font-size:17px}
.tipo-h .pill{margin:0}
.tipo dl{margin:0 0 0 40px;display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);font-size:14.5px}
.tipo dt{font-weight:700;padding:4px 12px 4px 0}
.tipo dd{margin:0;padding:4px 0;color:var(--muted)}
.tipo .callout{margin:10px 0 0 40px}
.teste{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.teste h4{margin:0 0 4px;font-size:17px}
.teste>p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.tq{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.tq .yn{display:flex;gap:6px}
.tq button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px}
.tq button[aria-pressed="true"].y{background:var(--green);border-color:var(--green);color:#fff}
.tq button[aria-pressed="true"].n{background:#B3412E;border-color:#B3412E;color:#fff}
.tres{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:15px;background:var(--soft);color:var(--muted)}
.tres.ok{background:var(--green);color:#fff}
.tres.no{background:#B3412E;color:#fff}
.login{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;align-items:baseline}
.login h4{grid-column:1/-1;margin:0 0 6px;font-size:16px}
.login dt{font-weight:700;font-size:14px;color:var(--muted)}
.login dd{margin:0;font-size:16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.login dd.cofre{font-weight:500;font-size:14.5px;color:var(--muted)}
.copy{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 9px;font-size:12.5px;font-weight:600}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dates div{padding:14px 16px;border-right:1px solid var(--line)}
.dates div:last-child{border-right:0}
.dates b{display:block;font-size:26px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.dates span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
.gat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gat div{background:var(--green);color:#fff;border-radius:12px;padding:16px 18px}
:root[data-theme="dark"] .gat div{background:#2C4421}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gat div{background:#2C4421}}
.gat b{display:block;font-size:40px;font-weight:800;line-height:1}
.gat span{font-size:14px;opacity:.92;line-height:1.35;display:block;margin-top:6px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;position:relative}
.hub-c{grid-column:1/-1;text-align:center;background:var(--green);color:#fff;border-radius:12px;padding:12px;font-weight:800}
:root[data-theme="dark"] .hub-c{background:#2C4421}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hub-c{background:#2C4421}}
.hub div:not(.hub-c){border:1px solid var(--line);border-top:3px solid var(--green);border-radius:10px;padding:10px 12px;background:var(--surface)}
.hub b{display:block;font-size:14.5px}
.hub span{font-size:13px;color:var(--muted)}
.attr-g{margin:0 0 18px}
.attr-g h4{font-size:15px;margin:18px 0 4px;color:var(--green-ink)}
.attr-g ul{margin:0;padding:0;list-style:none}
.attr-g li{padding:7px 0 7px 18px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.attr-g li::before{content:"";position:absolute;left:2px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.resumo2{font-size:16px;color:var(--muted);max-width:68ch;margin:-12px 0 28px}

@media (max-width:900px){

  .mob-cargo{display:block}
  .mob-cargo select{font:inherit;font-weight:700;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
  aside.home-mode{display:none}
}
@media (max-width:620px){
  .pairs,.tipo dl{grid-template-columns:1fr}
  .pairs dt{border-bottom:0;padding-bottom:0}
  .tipo dl,.tipo .callout{margin-left:0}
  .tipo dt{padding-bottom:0}
  .ua{grid-template-columns:1fr}
  .eixo{grid-template-columns:1fr;gap:2px}
  .dates,.gat{grid-template-columns:1fr}
  .dates div{border-right:0;border-bottom:1px solid var(--line)}
  .mcard{grid-template-columns:1fr}
  .mcard .cnt{grid-column:1;grid-row:auto;text-align:left;display:flex;gap:8px;align-items:baseline}
  .mcard .cnt b{font-size:26px}
}

nav .n{min-width:20px}
@media (max-width:900px){section.block{scroll-margin-top:56px}}

.prm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.prm-h{display:flex;align-items:center;gap:12px}
.prm-h b{font-size:16.5px}
.prm-n{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0}
:root[data-theme="dark"] .prm-n{color:#132015}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prm-n{color:#132015}}
.prm-d{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.prm-box{margin-top:12px;background:var(--soft);border-radius:10px;padding:12px 14px;position:relative}
.prm-l{display:block;font-size:12px;font-weight:700;color:var(--green-ink);margin-bottom:4px}
.prm-box pre{margin:0 0 10px;white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55}

.matriz th[scope=row]{background:var(--surface);font-size:14px}
.sync-grid{display:grid;gap:14px}
.sync-f span,.seg legend{display:block;font-size:13px;font-weight:600;margin-bottom:6px;padding:0;opacity:.9}
.sync-f input{font:inherit;font-size:20px;font-weight:700;width:100%;max-width:260px;padding:8px 12px;border-radius:8px;border:0;background:#fff;color:#1E2A21}
.seg{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}

.seg input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.sync-res{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sync-res b{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sync-res span{font-size:14px;opacity:.9}

.ficha .full{grid-column:1/-1;border-right:0;border-top:1px solid var(--line)}

/* ---- dentro do app de visitas: busca, offline e volta ---- */
.voltar{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none}
.voltar:hover{color:var(--green-ink)}
.busca{display:flex;flex-direction:column;gap:6px}
.busca-campo{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;color:var(--muted)}
.busca-campo:focus-within{border-color:var(--green)}
.busca-campo svg{flex:none}
.busca-campo input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:9px 0;outline:none}
.busca-campo input::-webkit-search-cancel-button{cursor:pointer}
.busca-res{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.busca-res[hidden]{display:none}
.busca-res span{flex:1}
.busca-res button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:34px;height:30px;display:grid;place-items:center;padding:0}
.busca-res button:hover{border-color:var(--green)}
mark.hit{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}
mark.hit.atual{background:#F2B300;box-shadow:0 0 0 2px #F2B300}
:root[data-theme="dark"] mark.hit{background:#6B5A12}
:root[data-theme="dark"] mark.hit.atual{background:#B98A00;box-shadow:0 0 0 2px #B98A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.hit{background:#6B5A12}:root:not([data-theme="light"]) mark.hit.atual{background:#B98A00;box-shadow:0 0 0 2px #B98A00}}
.offline{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:4px}
.sw-off{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700}
.sw-off input{position:absolute;opacity:0;width:1px;height:1px}
.trilho{flex:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s}
.trilho::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw-off input:checked+.trilho{background:var(--green)}
.sw-off input:checked+.trilho::after{transform:translateX(16px)}
.sw-off input:focus-visible+.trilho{outline:2px solid var(--green);outline-offset:2px}
.offline small{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.4}
#offBtn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.aviso[hidden]{display:none}
@media (max-width:900px){
  .busca{padding:0 14px 10px}
  .busca-campo input{font-size:16px}
  .voltar{margin-top:12px}
}
@media print{.busca,.voltar,.aviso{display:none!important}mark.hit{background:none;box-shadow:none}}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const pillCls = p => "p-" + p.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const title = t => t ? `<h3>${esc(t)}</h3>` : "";

function block(b, ctx) {

let io, current = undefined;
function wire(view) {
  view.querySelectorAll("details.phase").forEach(d => {
    const upd = () => { const cbs = d.querySelectorAll("input"); const c = [...cbs].filter(x => x.checked).length;
      d.querySelector(".pc").textContent = `${c}/${cbs.length}`; d.querySelector(".bar i").style.width = (c / cbs.length * 100) + "%"; d.classList.toggle("done", c === cbs.length); };
    d.addEventListener("change", e => { const k = e.target.dataset.k; if (!k) return; if (e.target.checked) state[k] = 1; else delete state[k]; save(); upd(); });
    upd();
  });
  const conv = view.querySelector("#conv");
  if (conv) {
    const set = (id, v) => view.querySelector("#" + id).textContent = v;
    const calc = () => { const n = +conv.value; set("convOut", n); set("rChope", n + " L"); const b = Math.ceil(n / 50); set("rBarril", b + (b > 1 ? " barris" : " barril"));
      set("rCarne", (n * 0.5).toLocaleString("pt-BR", {maximumFractionDigits:1}) + " kg"); set("rPao", n * 2); set("rTom", Math.ceil(n / 2)); set("rCeb", Math.ceil(n / 4)); set("rCad", Math.round(n * 0.8));
      view.querySelector("#over").style.display = n > 50 ? "block" : "none"; };
    conv.addEventListener("input", calc); calc();
  }
  const sc = view.querySelector("#sync");
  if (sc) {
    const run = () => {
      const v = parseFloat(String(sc.querySelector("#sVal").value).replace(/\./g, "").replace(",", ".")) || 0;
      const faixa = +sc.querySelector("input[name=cat]:checked").value;
      const t = sc.querySelector("input[name=tipo]:checked"); const mult = +t.value;
      const coins = Math.floor(v / faixa) * mult;
      sc.querySelector("#sOut").textContent = coins.toLocaleString("pt-BR", {maximumFractionDigits:2});
      sc.querySelector("#sVal2").textContent = t.dataset.val;
    };
    sc.addEventListener("input", run); run();
  }
  view.querySelectorAll("[data-teste]").forEach(t => {
    const ans = {};
    t.addEventListener("click", e => { const btn = e.target.closest("button"); if (!btn) return; const q = btn.closest(".tq");
      q.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === btn)); ans[q.dataset.q] = btn.classList.contains("y");
      const r = t.querySelector(".tres"); const vals = Object.values(ans);
      if (vals.includes(false)) { r.className = "tres no"; r.textContent = "Não repostar."; }
      else if (vals.length === 3) { r.className = "tres ok"; r.textContent = "Pode repostar."; }
      else { r.className = "tres"; r.textContent = "Responda as três perguntas."; } });
  });
  if (io) io.disconnect();
  const links = [...document.querySelectorAll("#nav a")];
  io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return;
    links.forEach(l => l.classList.toggle("on", l.getAttribute("href").endsWith("/" + en.target.id)));
    const on = links.find(l => l.classList.contains("on")); if (on && innerWidth <= 900) { const ol = on.closest("ol"); ol.scrollTo({left: on.offsetLeft - ol.clientWidth / 2 + on.offsetWidth / 2, behavior:"smooth"}); } }), {rootMargin:"-30% 0px -60% 0px"});
  view.querySelectorAll("section.block").forEach(s => io.observe(s));
}

function route() {
  const [slug, sec] = location.hash.replace(/^#/, "").split("/");
  const key = SLUG[slug] || null;
  const view = document.getElementById("view");
  if (key !== current) {
    current = key;
    view.innerHTML = key ? renderMip(key) : renderHome();
    document.getElementById("side").classList.toggle("home-mode", !key);
    renderSide(key); wire(view);
    if (!sec) { window.scrollTo({top:0, behavior:"instant"}); if (temBusca()) buscar(); }
    else { requestAnimationFrame(() => { const el = document.getElementById(sec); if (el) el.scrollIntoView({behavior:"instant"}); }); if (temBusca()) buscar(false); return; }
  }
  if (sec) { const el = document.getElementById(sec); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
}
window.addEventListener("hashchange", route);
document.getElementById("cargoSel").addEventListener("change", e => { location.hash = e.target.value ? "#" + e.target.value : "#"; });
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if (c) { try { navigator.clipboard.writeText(c.dataset.copy); const o = c.textContent; c.textContent = "Copiado"; setTimeout(() => c.textContent = o, 1500); } catch(err) {} return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "print") window.print();
  if (act === "theme") { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; }
  if (act === "reset") {
    const scope = current ? MIPS[current].short : "todos os manuais";
    if (!confirm(`Desmarcar os check-lists de ${scope}?`)) return;
    for (const k in state) if (!current || k.startsWith(current + ".")) delete state[k];
    save(); document.querySelectorAll(".items input").forEach(x => { x.checked = false; x.dispatchEvent(new Event("change", {bubbles:true})); });
  }
});

/* ---------- busca por palavra-chave ----------
   Ignora acento e maiúscula ("germinacao" acha "Germinação"), marca
   cada ocorrência na página, abre o check-list fechado que a contém e
   anda entre elas com as setas, Enter (próximo) e Shift+Enter. */
const qIn = document.getElementById("q");
const qRes = document.getElementById("qRes");
const qCount = document.getElementById("qCount");
let hits = [], hitAt = -1, qTimer;
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const temBusca = () => qIn.value.trim().length >= 2;
const suave = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

function limpaMarcas() {
  document.querySelectorAll("#view mark.hit").forEach(m => {
    const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
  });
  hits = []; hitAt = -1;
}
function marca(termo) {
  const alvo = fold(termo);
  const view = document.getElementById("view");
  const w = document.createTreeWalker(view, NodeFilter.SHOW_TEXT, { acceptNode: n =>
    n.nodeValue.trim() && !n.parentElement.closest("script,style,button,select,option,textarea")
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  nos.forEach(no => {
    const txt = no.nodeValue;
    let f = ""; const mapa = [];
    for (let i = 0; i < txt.length; i++) { const c = fold(txt[i]); for (let j = 0; j < c.length; j++) { f += c[j]; mapa.push(i); } }
    const achados = [];
    for (let p = f.indexOf(alvo); p >= 0; p = f.indexOf(alvo, p + alvo.length))
      achados.push([mapa[p], mapa[p + alvo.length - 1] + 1]);
    for (let k = achados.length - 1; k >= 0; k--) {
      const [a, b] = achados[k];
      const meio = no.splitText(a); meio.splitText(b - a);
      const m = document.createElement("mark"); m.className = "hit";
      meio.parentNode.replaceChild(m, meio); m.appendChild(meio);
    }
  });
  hits = [...view.querySelectorAll("mark.hit")];
}
function vai(i) {
  if (!hits.length) return;
  if (hitAt >= 0) hits[hitAt].classList.remove("atual");
  hitAt = (i + hits.length) % hits.length;
  const h = hits[hitAt]; h.classList.add("atual");
  for (let d = h.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
  h.scrollIntoView({block:"center", behavior:suave()});
  qCount.textContent = `${hitAt + 1} de ${hits.length}`;
}
function buscar(rolar = true) {
  limpaMarcas();
  const t = qIn.value.trim();
  if (t.length < 2) { qRes.hidden = true; return; }
  if (!current) {
    /* Na tela inicial, abre o primeiro manual que tem a palavra; a
       rota chama a busca de novo depois de montar a página. */
    const k = ORDER.find(k => fold(JSON.stringify(MIPS[k])).includes(fold(t)));
    if (k) { location.hash = "#" + MIPS[k].slug; return; }
  }
  marca(t);
  qRes.hidden = false;
  if (!hits.length) { qCount.textContent = "Nada encontrado"; return; }
  if (rolar) vai(0);
  else qCount.textContent = hits.length === 1 ? "1 resultado" : `${hits.length} resultados`;
}
qIn.addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(buscar, 220); });
qIn.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault(); clearTimeout(qTimer);
    if (!hits.length) buscar(); else vai(hitAt + (e.shiftKey ? -1 : 1));
  }
  if (e.key === "Escape") { qIn.value = ""; buscar(); }
});
document.getElementById("qPrev").addEventListener("click", () => vai(hitAt - 1));
document.getElementById("qNext").addEventListener("click", () => vai(hitAt + 1));
/* Ctrl+F / Cmd+F vai para a busca do manual. */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f" && document.activeElement !== qIn) {
    e.preventDefault(); qIn.focus(); qIn.select();
  }
});

/* ---------- disponibilizar offline ----------
   Guarda esta página num cache só dela ("mip-offline"); o /sw.js do app
   serve a cópia quando não há sinal e a atualiza sempre que a página
   abre com internet. As marcações dos check-lists ficam no próprio
   aparelho (localStorage) e continuam valendo sem internet. */
const OFF_CACHE = "mip-offline", OFF_KEY = "mip-offline-em";
const PAGINA = location.pathname;
const podeOff = "caches" in window && location.protocol.startsWith("http");
const offChk = document.getElementById("offChk");
const offBtn = document.getElementById("offBtn");
const offInfo = document.getElementById("offInfo");
let avisoTimer;

function aviso(msg) {
  let el = document.querySelector(".aviso");
  if (!el) { el = document.createElement("div"); el.className = "aviso"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => el.hidden = true, 3200);
}
function mostraOff(lig) {
  offChk.checked = lig;
  offBtn.setAttribute("aria-pressed", String(lig));
  offBtn.textContent = lig ? "✓ Offline" : "Offline";
  let em = ""; try { em = localStorage.getItem(OFF_KEY) || ""; } catch (e) {}
  offInfo.textContent = !podeOff ? "Abra pelo site para poder guardar o manual no aparelho."
    : lig ? `Salvo neste aparelho${em ? " em " + em : ""}. Abre sem internet, com as marcações.`
          : "Guarda o manual neste aparelho para abrir sem internet.";
}
async function offAtual() {
  if (!podeOff) return false;
  try { return !!(await (await caches.open(OFF_CACHE)).match(PAGINA)); } catch (e) { return false; }
}
async function offLiga(sim) {
  if (!podeOff) { aviso("Abra pelo site para guardar o manual."); mostraOff(false); return; }
  try {
    const c = await caches.open(OFF_CACHE);
    if (sim) {
      const r = await fetch(PAGINA, {cache:"no-cache"});
      if (!r.ok) throw new Error(r.status);
      await c.put(PAGINA, r);
      /* fonte do manual, para ela também abrir sem sinal */
      const css = document.querySelector('link[href*="fonts.googleapis.com/css"]');
      if (css) fetch(css.href).catch(() => {});
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      try { localStorage.setItem(OFF_KEY, new Date().toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"})); } catch (e) {}
      aviso("Pronto: o manual abre neste aparelho mesmo sem internet.");
    } else {
      await c.delete(PAGINA);
      try { localStorage.removeItem(OFF_KEY); } catch (e) {}
      aviso("O manual não fica mais guardado no aparelho.");
    }
  } catch (e) {

  }
  mostraOff(await offAtual());
}
