*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--fundo);
  color:var(--tinta);
  font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.5;
}

/* ---------- cabeçalho ---------- */
header{
  background:var(--principal);
  color:#fff;
  padding:20px 20px 18px;
  padding-top:max(20px,env(safe-area-inset-top));
}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:13px;font-weight:400;color:#C3D8F2}
.marcas{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lg{display:block;background-repeat:no-repeat;background-position:left center;background-size:contain}
.lg-tf{width:74px;height:22px;background-image:var(--logo-tf)}
.lg-foc{width:90px;height:14px;background-image:var(--logo-foc-tela)}
.risco{width:1px;height:18px;background:rgba(255,255,255,.38);flex:none}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sessao{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Os dois botões andam juntos. Soltos no .sessao, em tela estreita o
   e-mail gruda no primeiro e empurra o "Sair" sozinho para a linha de
   baixo; agrupados, o par inteiro é que desce. */
.acoes-sessao{display:flex;align-items:center;gap:10px}
#quem-entrou{font-size:13px;color:#C3D8F2}
button.sair{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.4);
  padding:7px 14px;
  font-size:14px;
}
button.sair:hover{background:rgba(255,255,255,.24)}
/* Caminho de volta ao formulário, o par do botão "Painel" que existe
   lá. Mesma roupa do "Sair", e o "+" é o que evita a troca de um pelo
   outro na pressa — sair por engano custa a sessão. */
a.nova{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.4);
  border-radius:var(--raio);
  color:#fff;text-decoration:none;
  font-size:14px;font-weight:600;
  white-space:nowrap;
}
a.nova:hover{background:rgba(255,255,255,.24)}
a.nova svg{flex:none}

/* ---------- estrutura ---------- */
main{max-width:940px;margin:0 auto;padding:20px 16px 40px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}

/* ---------- campos ---------- */
label{display:block;font-size:13px;font-weight:500;color:var(--tinta-fraca);margin-bottom:4px}
input,select,button{font-family:inherit;font-size:16px}
input[type=text],input[type=email],input[type=password],input[type=date],select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--linha);
  border-radius:var(--raio);
  background:#fff;
  color:var(--tinta);
}
input:focus,select:focus{outline:2px solid var(--apoio);outline-offset:-1px}

button{
  border:0;
  border-radius:var(--raio);
  padding:11px 16px;
  font-weight:600;
  background:var(--principal);
  color:#fff;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:default}
button.leve{background:#fff;color:var(--principal);border:1px solid var(--linha)}

/* ---------- login ---------- */
.entrada{max-width:380px;margin:44px auto;background:#fff;border:1px solid var(--linha);
  border-radius:14px;padding:24px}
.entrada h2{font-size:17px;margin-bottom:4px}
.entrada p.ajuda{margin:0 0 20px;font-size:13px;color:var(--tinta-fraca)}
.entrada .campo{margin-bottom:14px}
.entrada button{width:100%;margin-top:6px}

.erro{
  background:#FBEAEA;
  border:1px solid #E7B9B9;
  color:var(--alerta);
  border-radius:var(--raio);
  padding:10px 12px;
  font-size:14px;
  margin-bottom:14px;
}

/* ---------- filtros ---------- */
.filtros{
  background:#fff;
  border:1px solid var(--linha);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.filtros .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- resumo ---------- */
.resumo{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.numero{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.numero b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.numero span{font-size:12px;color:var(--tinta-fraca)}
.numero.atencao b{color:var(--alerta)}

/* ---------- lista ---------- */
.contagem{font-size:13px;color:var(--tinta-fraca);margin:0 0 10px}
.visita{
  background:#fff;
  border:1px solid var(--linha);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
}
.visita>summary{
  list-style:none;
  cursor:pointer;
  padding:14px 16px;
  display:flex;
  gap:12px;
  align-items:baseline;
  flex-wrap:wrap;
}
.visita>summary::-webkit-details-marker{display:none}
.visita[open]>summary{background:var(--marcado);border-bottom:1px solid var(--linha)}
.quando{font-weight:600;font-size:14px;white-space:nowrap}
.quem{font-weight:600;font-size:15px;flex:1 1 200px}
.por{font-size:13px;color:var(--tinta-fraca)}
.etiqueta{
  font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;background:var(--fundo2);color:var(--principal);
}
.etiqueta.vencida{background:#FBEAEA;color:var(--alerta)}
.corpo{padding:16px}
.corpo h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--tinta-fraca);margin:18px 0 6px;font-weight:600}
.corpo h3:first-child{margin-top:0}
.texto{white-space:normal}
.texto p{margin:0 0 8px}
.texto ul,.texto ol{margin:0 0 8px;padding-left:22px}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fotos a{display:block;width:104px;height:104px;border-radius:8px;overflow:hidden;
  border:1px solid var(--linha);background:var(--fundo2)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.marcados{display:flex;gap:6px;flex-wrap:wrap}
.marcados span{font-size:12px;background:var(--fundo2);color:var(--principal);
  padding:3px 10px;border-radius:999px}
.dados{display:grid;gap:4px 18px;grid-template-columns:auto 1fr;font-size:14px;margin:0}
.dados dt{color:var(--tinta-fraca)}
.dados dd{margin:0}

.pe{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--linha)}
.aviso-pdf{font-size:13px;color:var(--alerta)}
.vazio{background:#fff;border:1px dashed var(--linha);border-radius:14px;
  padding:28px 16px;text-align:center;color:var(--tinta-fraca);font-size:14px}
.rodape{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.carregando{text-align:center;color:var(--tinta-fraca);font-size:14px;padding:30px}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="topo">
    <div>
      <div class="marcas">
        <span class="lg lg-tf" role="img" aria-label="Terra Forte"></span>
        <span class="risco"></span>
        <span class="lg lg-foc" role="img" aria-label="Focalização"></span>
      </div>
      <h1>Painel de visitas</h1>
      <p id="assinatura">Consulta dos registros enviados pelos consultores</p>
    </div>
    <div class="sessao" id="sessao" hidden>
      <span id="quem-entrou"></span>
      <div class="acoes-sessao">
        <a class="nova" href="/">

<!-- jsPDF e o desenho do relatorio: os mesmos arquivos que o
     formulario carrega, para o PDF sair identico. -->
<script src="/vendor-jspdf.js"></script>
<script src="/relatorio.js"></script>

<script>
/* ===================================================================
   1. CONFIGURAÇÃO
   A mesma chave do formulário. Ela não lê nada sozinha: quem abre a
   leitura é o login, com a regra "admin le" do banco.
   =================================================================== */
const SUPABASE = {
  url:   "https://iozeyyuftogrpsndkrvj.supabase.co",
  chave: "sb_publishable_41oi3yeqR7h4BxPAdEcQow_aQ6by_sJ",
  tabela: "visitas"
};

/* O checklist (ITENS) vem de /relatorio.js, o mesmo arquivo que o
   formulário carrega — item novo se cadastra num lugar só. Aqui só
   viro a lista em um mapa de id para rótulo. */
const ROTULOS = Object.fromEntries(ITENS.map(([id, rotulo]) => [id, rotulo]));

const ORIGENS = { focalizacao: "Focalização", "terra-forte": "Terra Forte" };

const $ = id => document.getElementById(id);
const GUARDA = "painel-sessao";

let sessao = null;   /* { access_token, refresh_token, expira_em, email } */
let visitas = [];    /* tudo o que veio do banco */

/* ===================================================================
   2. SESSÃO
   =================================================================== */
function guarda(s) {
  sessao = s;
  try { localStorage.setItem(GUARDA, JSON.stringify(s)); } catch (e) { console.warn(e); }
}

function esquece() {
  sessao = null;
  try { localStorage.removeItem(GUARDA); } catch (e) { console.warn(e); }
}

function recupera() {
  try { return JSON.parse(localStorage.getItem(GUARDA) || "null"); }
  catch (e) { return null; }
}

function daSessao(resposta, email) {
  return {
    access_token:  resposta.access_token,
    refresh_token: resposta.refresh_token,
    /* um minuto de folga, para não usar um token que vence no caminho */
    expira_em:     Date.now() + (resposta.expires_in - 60) * 1000,
    email:         (resposta.user && resposta.user.email) || email || ""
  };
}

async function entra(email, senha) {
  const r = await fetch(`${SUPABASE.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE.chave, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: senha })
  });
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) {
    throw new Error(
      /invalid/i.test(corpo.error_description || corpo.msg || corpo.error || "")
        ? "E-mail ou senha não conferem."
        : (corpo.error_description || corpo.msg || "Não foi possível entrar."));
  }
  guarda(daSessao(corpo, email));
}

async function renova() {
  if (!sessao || !sessao.refresh_token) return false;
  const r = await fetch(`${SUPABASE.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SUPABASE.chave, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: sessao.refresh_token })
  });
  if (!r.ok) return false;
  guarda(daSessao(await r.json(), sessao.email));
  return true;
}

/* Todo pedido ao banco passa por aqui, para renovar o token quando
   preciso e cair no login quando a sessão morreu de vez. */
async function pede(caminho) {
  if (sessao && Date.now() > sessao.expira_em) {
    if (!await renova()) { mostraLogin("Sua sessão expirou. Entre de novo."); return null; }
  }
  const r = await fetch(`${SUPABASE.url}${caminho}`, {
    headers: {
      apikey: SUPABASE.chave,
      Authorization: "Bearer " + sessao.access_token
    }
  });
  if (r.status === 401 || r.status === 403) {
    if (await renova()) return pede(caminho);
    mostraLogin("Sua sessão expirou. Entre de novo.");
    return null;
  }
  if (!r.ok) throw new Error("banco: " + r.status + " " + await r.text());
  return r.json();
}

/* ===================================================================
   3. TELAS
   =================================================================== */
function mostraLogin(aviso) {
  esquece();
  visitas = [];
  $("lista").innerHTML = "";
  $("painel").hidden = true;
  $("carregando").hidden = true;
  $("sessao").hidden = true;
  $("entrada").hidden = false;
  $("assinatura").textContent = "Consulta dos registros enviados pelos consultores";
  if (aviso) {
    $("erro-login").textContent = aviso;
    $("erro-login").hidden = false;
  }
}

async function mostraPainel() {
  $("entrada").hidden = true;
  $("painel").hidden = true;
  $("carregando").hidden = false;
  $("quem-entrou").textContent = sessao.email;
  $("sessao").hidden = false;

  try {
    const dados = await pede(
      `/rest/v1/${SUPABASE.tabela}` +
      `?select=*&order=data_visita.desc,registrado_em.desc&limit=2000`);
    if (dados === null) return;            /* caiu no login */
    visitas = dados;
    preencheFiltros();
    desenha();
    $("carregando").hidden = true;
    $("painel").hidden = false;
  } catch (e) {
    console.error(e);
    $("carregando").hidden = true;
    $("painel").hidden = false;
    $("erro-painel").textContent =
      "Não foi possível carregar os registros. " + e.message;
    $("erro-painel").hidden = false;
  }
}

/* ===================================================================
   4. FILTROS
   A lista inteira vem de uma vez e a filtragem é aqui na tela: são
   poucos milhares de linhas, e assim o filtro responde na hora.
   =================================================================== */
function preencheFiltros() {
  const enche = (id, valores) => {
    const sel = $(id);
    const atual = sel.value;
    sel.length = 1;
    [...new Set(valores.filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"))
      .forEach(v => sel.add(new Option(v, v)));
    sel.value = atual;
  };
  enche("f-consultor", visitas.map(v => v.consultor));
  enche("f-produtor",  visitas.map(v => v.produtor));
  enche("f-municipio", visitas.map(v => v.municipio));
}

function filtradas() {
  const busca = $("f-busca").value.trim().toLowerCase();
  const consultor = $("f-consultor").value;
  const produtor  = $("f-produtor").value;
  const municipio = $("f-municipio").value;
  const origem    = $("f-origem").value;
  const de  = $("f-de").value;
  const ate = $("f-ate").value;

  return visitas.filter(v => {
    if (consultor && v.consultor !== consultor) return false;
    if (produtor  && v.produtor  !== produtor)  return false;
    if (municipio && v.municipio !== municipio) return false;
    if (origem    && v.origem    !== origem)    return false;
    if (de  && v.data_visita < de)  return false;
    if (ate && v.data_visita > ate) return false;
    if (busca) {
      const palheiro = [v.produtor, v.consultor, v.municipio, v.descricao, v.acao]
        .join(" ").toLowerCase();
      if (!palheiro.includes(busca)) return false;
    }
    return true;
  });
}

/* ===================================================================
   5. DESENHO
   =================================================================== */
const hoje = new Date().toISOString().slice(0, 10);
const br = d => d ? d.split("-").reverse().join("/") : "";
const escapa = t => String(t == null ? "" : t)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

/* A descrição vem com formatação. O formulário já limpa na entrada;
   aqui limpa de novo, porque texto de terceiro nunca entra cru. */
const TAGS_OK = { B:1, STRONG:1, I:1, EM:1, U:1, BR:1, UL:1, OL:1, LI:1, P:1, DIV:1 };
function limpaHtml(html) {
  const caixa = document.createElement("div");
  caixa.innerHTML = html || "";
  (function anda(no) {
    for (const filho of [...no.children]) {
      anda(filho);
      if (!TAGS_OK[filho.tagName]) filho.replaceWith(...filho.childNodes);
      else [...filho.attributes].forEach(a => filho.removeAttribute(a.name));
    }
  })(caixa);
  return caixa.innerHTML;
}

const vencida = v => v.prazo_acao && v.prazo_acao < hoje && (v.acao || "").trim();

function desenha() {
  const lista = filtradas();

  $("n-visitas").textContent    = lista.length;
  $("n-produtores").textContent = new Set(lista.map(v => v.produtor)).size;
  $("n-vencidas").textContent   = lista.filter(vencida).length;
  $("n-fotos").textContent      = lista.reduce((s, v) => s + (v.fotos || []).length, 0);

  $("contagem").textContent = lista.length === visitas.length
    ? `${visitas.length} ${visitas.length === 1 ? "visita" : "visitas"}`
    : `${lista.length} de ${visitas.length}`;

  if (!lista.length) {
    $("lista").innerHTML = `<div class="vazio">${
      visitas.length ? "Nenhuma visita com esses filtros."
                     : "Nenhuma visita registrada ainda."}</div>`;
    return;
  }

  $("lista").innerHTML = lista.map(cartao).join("");
}

function cartao(v) {
  const extras   = v.extras || {};
  const situacao = extras.situacao || {};
  const marcados = Object.entries(situacao)
    .filter(([, sim]) => sim)
    .map(([id]) => `<span>${escapa(ROTULOS[id] || id)}</span>`).join("");

  const fotos = (v.fotos || []).map(u =>
    `<a href="${escapa(u)}" target="_blank" rel="noopener">
       <img src="${escapa(u)}" alt="Foto da visita" loading="lazy"></a>`).join("");

  const areas = [
    extras.talhao ? `<dt>Talhão / referência</dt><dd>${escapa(extras.talhao)}</dd>` : "",
    extras.relator ? `<dt>Relatório feito por</dt><dd>${escapa(extras.relator)}</dd>` : "",
    extras.area_manejo_ha      != null ? `<dt>Área de manejo</dt><dd>${extras.area_manejo_ha} ha</dd>` : "",
    extras.area_experimental_ha != null ? `<dt>Área experimental</dt><dd>${extras.area_experimental_ha} ha</dd>` : ""
  ].join("");

  return `
<details class="visita">
  <summary>
    <span class="quando">${br(v.data_visita)}</span>
    <span class="quem">${escapa(v.produtor)}</span>
    <span class="por">${escapa(v.consultor)}${v.municipio ? " · " + escapa(v.municipio) : ""}</span>
    ${vencida(v) ? '<span class="etiqueta vencida">ação vencida</span>' : ""}
    ${(v.fotos || []).length ? `<span class="etiqueta">${v.fotos.length} foto${v.fotos.length > 1 ? "s" : ""}</span>` : ""}
    <span class="etiqueta">${escapa(ORIGENS[v.origem] || v.origem)}</span>
  </summary>
  <div class="corpo">
    <h3>Descrição</h3>
    <div class="texto">${limpaHtml(v.descricao_html) ||
       escapa(v.descricao).replace(/\n/g, "<br>") || "<i>sem descrição</i>"}</div>

    ${(v.acao || "").trim() ? `
      <h3>Ação combinada</h3>
      <div class="texto">${escapa(v.acao).replace(/\n/g, "<br>")}
        ${v.prazo_acao ? `<br><b>Prazo:</b> ${br(v.prazo_acao)}${vencida(v) ? " (vencido)" : ""}` : ""}
      </div>` : ""}

    ${marcados ? `<h3>Situação na visita</h3><div class="marcados">${marcados}</div>` : ""}

    ${fotos ? `<h3>Fotos</h3><div class="fotos">${fotos}</div>` : ""}

    <h3>Registro</h3>
    <dl class="dados">
      ${areas}
      <dt>Enviado em</dt>
      <dd>${new Date(v.registrado_em).toLocaleString("pt-BR")}</dd>
    </dl>

    <div class="pe">
      <button type="button" class="leve pdf" data-id="${escapa(v.id)}">Baixar PDF</button>
      <span class="aviso-pdf"></span>
    </div>
  </div>
</details>`;
}

/* ===================================================================
   6. O MESMO PDF QUE SAI NO CELULAR

   O desenho do relatório está em /relatorio.js, carregado aqui e no
   formulário — é literalmente a mesma função, então o PDF sai idêntico.

   O que muda é a forma das fotos: no celular elas estão embutidas como
   dados; aqui vêm como endereço no Storage, e o jsPDF precisa dos dados
   para desenhar. Então cada foto é buscada e convertida antes.
   =================================================================== */
function fotoParaDados(url) {
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error("foto " + r.status); return r.blob(); })
    .then(blob => new Promise((ok, falha) => {
      const leitor = new FileReader();
      leitor.onload = () => ok(leitor.result);
      leitor.onerror = falha;
      leitor.readAsDataURL(blob);
    }));
}

/* A linha do banco no formato que gerarPdf() espera. */
async function paraRelatorio(v) {
  const extras = v.extras || {};
  const fotos = [];
  let perdidas = 0;
  for (const url of v.fotos || []) {
    try { fotos.push({ dados: await fotoParaDados(url) }); }
    catch (e) { perdidas++; console.warn("foto nao veio:", url, e.message); }
  }
  return [{
    consultor: v.consultor,
    produtor: v.produtor,
    municipio: v.municipio || "",
    data_visita: v.data_visita,
    talhao: extras.talhao || "",
    relator: extras.relator || "",
    descricao: v.descricao || "",
    descricao_html: v.descricao_html || "",
    acao: v.acao || "",
    prazo_acao: v.prazo_acao || "",
    area_manejo_ha: extras.area_manejo_ha == null ? null : extras.area_manejo_ha,
    area_experimental_ha: extras.area_experimental_ha == null ? null : extras.area_experimental_ha,
    situacao: extras.situacao || {},
    fotos
  }, perdidas];
}

$("lista").addEventListener("click", async e => {
  const botao = e.target.closest("button.pdf");
  if (!botao) return;

  const visita = visitas.find(v => v.id === botao.dataset.id);
  const aviso = botao.parentElement.querySelector(".aviso-pdf");
  if (!visita) return;

  botao.disabled = true;
  botao.textContent = "Gerando…";
  aviso.textContent = "";
  try {
    const [registro, perdidas] = await paraRelatorio(visita);
    if (!baixaPdf(registro)) throw new Error("o PDF não pôde ser montado neste navegador");
    if (perdidas) {
      aviso.textContent = perdidas === 1
        ? "1 foto não pôde ser carregada e ficou de fora"
        : perdidas + " fotos não puderam ser carregadas e ficaram de fora";
    }
  } catch (err) {
    console.error(err);
    aviso.textContent = "Não deu para gerar: " + err.message;
  } finally {
    botao.disabled = false;
    botao.textContent = "Baixar PDF";
  }
});

/* ===================================================================
   7. EXPORTAR
   Ponto-e-vírgula e BOM porque é o que o Excel em português entende
   sem perguntar nada.
   =================================================================== */
function csv() {
  const lista = filtradas();
  const colunas = [
    ["data_visita",  v => br(v.data_visita)],
    ["consultor",    v => v.consultor],
    ["produtor",     v => v.produtor],
    ["municipio",    v => v.municipio],
    ["talhao",       v => ((v.extras || {}).talhao) || ""],
    ["relator",      v => ((v.extras || {}).relator) || ""],
    ["formulario",   v => ORIGENS[v.origem] || v.origem],
    ["area_manejo_ha",       v => (v.extras || {}).area_manejo_ha],
    ["area_experimental_ha", v => (v.extras || {}).area_experimental_ha],
    ...ITENS.map(([id, rotulo]) =>
      [rotulo, v => ((v.extras || {}).situacao || {})[id] ? "sim" : "nao"]),
    ["acao",        v => v.acao],
    ["prazo_acao",  v => br(v.prazo_acao)],
    ["fotos",       v => (v.fotos || []).length],
    ["descricao",   v => v.descricao],
    ["enviado_em",  v => new Date(v.registrado_em).toLocaleString("pt-BR")]
  ];

  const celula = valor => {
    const t = valor == null ? "" : String(valor);
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };

  const linhas = [colunas.map(c => c[0]).join(";")];
  lista.forEach(v => linhas.push(colunas.map(c => celula(c[1](v))).join(";")));

  const blob = new Blob(["﻿" + linhas.join("\r\n")],
                        { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"),
    { href: url, download: `visitas_${hoje}.csv` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ===================================================================
   8. LIGAÇÕES
   =================================================================== */
$("form-login").addEventListener("submit", async e => {
  e.preventDefault();
  $("erro-login").hidden = true;
  $("btn-entrar").disabled = true;
  $("btn-entrar").textContent = "Entrando…";
  try {
    await entra($("email").value.trim(), $("senha").value);
    $("senha").value = "";
    await mostraPainel();
  } catch (err) {
    $("erro-login").textContent = err.message;
    $("erro-login").hidden = false;
  } finally {
    $("btn-entrar").disabled = false;
    $("btn-entrar").textContent = "Entrar";
  }
});

["f-busca","f-consultor","f-produtor","f-municipio","f-origem","f-de","f-ate"]
  .forEach(id => $(id).addEventListener("input", desenha));

$("btn-limpar").addEventListener("click", () => {
  ["f-busca","f-consultor","f-produtor","f-municipio","f-origem","f-de","f-ate"]
    .forEach(id => $(id).value = "");
  desenha();
});

$("btn-csv").addEventListener("click", csv);
/* Sair avisa o Supabase, para o refresh token nao continuar valendo
   caso alguem tenha copiado o que estava guardado no aparelho. */
$("btn-sair").addEventListener("click", () => {
  if (sessao && sessao.access_token) {
    fetch(`${SUPABASE.url}/auth/v1/logout`, {
      method: "POST",
      headers: { apikey: SUPABASE.chave, Authorization: "Bearer " + sessao.access_token }
    }).catch(() => {});
  }
  mostraLogin();
});

/* --- começo --- */
sessao = recupera();
if (sessao && sessao.access_token) mostraPainel();
else mostraLogin();
